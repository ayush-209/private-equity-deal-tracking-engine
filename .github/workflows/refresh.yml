# Scheduled data refresh. Needs repository secret DATABASE_URL pointing at a reachable PostgreSQL
# (e.g. Neon, Supabase, RDS). Logs are uploaded as an artifact; every run is also recorded in pipeline_runs.
name: data-refresh
on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST weekdays, after NSE close: market data
    - cron: "0 2 * * 0"       # 07:30 IST Sundays: statements, ownership, re-screen
  workflow_dispatch:
    inputs:
      job: {description: "market | fundamentals | screen | all", default: "all"}
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 2 * * 0" ]; then echo "job=fundamentals" >> $GITHUB_OUTPUT
          else echo "job=market" >> $GITHUB_OUTPUT; fi
      - run: python -m scripts.run_pipeline ${{ steps.pick.outputs.job }} --source yfinance
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: pipeline-logs, path: logs/}
