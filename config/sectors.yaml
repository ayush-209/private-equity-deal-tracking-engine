# Sectors excluded from the operating-company screen. EBITDA, net debt, FCF conversion and
# working-capital days are not meaningful for lenders and insurers; they need a separate
# framework (NIM, GNPA/NNPA, CRAR, credit cost, combined ratio).
excluded_from_screen:
  - Financial Services
excluded_industries_keywords: [Bank, NBFC, Finance, Insurance, Housing Finance, Capital Markets]

